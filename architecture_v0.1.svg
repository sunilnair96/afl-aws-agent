<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 880" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#15803d"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b91c1c"/></marker>
    <style>
      .box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}
      .t{font-size:15px;font-weight:700;fill:#0f172a}
      .s{font-size:12.5px;fill:#334155}
      .n{font-size:12px;font-weight:700;fill:#fff}
      .lane{font-size:13px;font-weight:700;fill:#64748b;letter-spacing:.06em}
      .ln{stroke:#334155;stroke-width:1.8;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1400" height="880" fill="#f8fafc"/>
  <rect width="1400" height="64" fill="#0b2a4a"/>
  <text x="24" y="30" font-size="22" font-weight="700" fill="#fff">AFL Agent on AWS — initial architecture v0.1</text>
  <text x="24" y="52" font-size="13" fill="#cbd5e1">Identity travels with the request; business rules are enforced outside the LLM and the tools. Region ap-southeast-2.</text>

  <!-- lane labels -->
  <text class="lane" x="24" y="96">CLIENT</text><text class="lane" x="232" y="96">IDENTITY / EDGE</text>
  <text class="lane" x="452" y="96">AGENT</text><text class="lane" x="702" y="96">AUTHORIZATION (GATEWAY)</text>
  <text class="lane" x="962" y="96">TOOLS</text><text class="lane" x="1190" y="96">DATA</text>

  <!-- Client -->
  <rect class="box" x="20" y="110" width="180" height="150" rx="10"/>
  <text class="t" x="34" y="136">Users</text>
  <text class="s" x="34" y="158">User A: full history</text><text class="s" x="34" y="176">User B: seasons ≥ 2025</text>
  <text class="s" x="34" y="200">Never given AWS creds</text><text class="s" x="34" y="218">or data access</text>
  <rect class="box" x="20" y="290" width="180" height="150" rx="10"/>
  <text class="t" x="34" y="316">React SPA</text>
  <text class="s" x="34" y="338">Chat + "My Team"</text><text class="s" x="34" y="356">S3 + CloudFront</text>
  <text class="s" x="34" y="374">Cognito Hosted UI</text><text class="s" x="34" y="392">(OAuth2 code + PKCE)</text>

  <!-- Identity -->
  <rect class="box" x="232" y="110" width="190" height="170" rx="10" stroke="#be123c"/>
  <text class="t" x="246" y="136">Amazon Cognito</text>
  <text class="s" x="246" y="158">User pool, public SPA client</text><text class="s" x="246" y="176">Groups: full-history,</text>
  <text class="s" x="246" y="194">recent-only</text><text class="s" x="246" y="216">Issues JWT access token</text><text class="s" x="246" y="234">(sub, client_id, groups)</text>
  <rect class="box" x="232" y="310" width="190" height="130" rx="10"/>
  <text class="t" x="246" y="336">API Gateway (HTTP)</text>
  <text class="s" x="246" y="358">JWT authorizer</text><text class="s" x="246" y="376">/my-team, /locks, /avoid</text>
  <text class="s" x="246" y="394">(non-LLM CRUD path)</text>

  <!-- Agent -->
  <rect class="box" x="452" y="110" width="220" height="190" rx="10" stroke="#1d4ed8"/>
  <text class="t" x="466" y="136">AgentCore Runtime</text>
  <text class="s" x="466" y="158">Strands agent loop</text><text class="s" x="466" y="176">Inbound JWT authorizer</text>
  <text class="s" x="466" y="194">Authorization header allow-listed</text><text class="s" x="466" y="212">System prompt: comp. rules,</text>
  <text class="s" x="466" y="230">"numbers only from tools"</text><text class="s" x="466" y="248">Forwards user JWT to Gateway</text>
  <text class="s" x="466" y="266">Max iterations / token caps</text>
  <rect class="box" x="452" y="330" width="220" height="110" rx="10" stroke="#1d4ed8"/>
  <text class="t" x="466" y="356">Amazon Bedrock</text>
  <text class="s" x="466" y="378">Claude (Sonnet) via inference</text><text class="s" x="466" y="396">profile · Bedrock Guardrails</text>
  <text class="s" x="466" y="414">AgentCore Memory (prefs, session)</text>

  <!-- Gateway -->
  <rect class="box" x="702" y="110" width="220" height="330" rx="10" stroke="#7e22ce"/>
  <text class="t" x="716" y="136">AgentCore Gateway</text>
  <text class="s" x="716" y="156">MCP endpoint · CUSTOM_JWT</text>
  <text class="s" x="716" y="174">Validates token + client</text>
  <rect x="716" y="192" width="192" height="76" rx="8" fill="#f3e8ff" stroke="#7e22ce"/>
  <text class="t" x="728" y="214" font-size="13">Lambda interceptor</text>
  <text class="s" x="728" y="233">sub → entitlement lookup;</text><text class="s" x="728" y="251">overwrites user_id, min_season</text>
  <rect x="716" y="282" width="192" height="92" rx="8" fill="#f3e8ff" stroke="#7e22ce"/>
  <text class="t" x="728" y="304" font-size="13">Policy engine (Cedar)</text>
  <text class="s" x="728" y="323">group → allowed tools</text><text class="s" x="728" y="341">season ≥ min_season</text>
  <text class="s" x="728" y="359">user_id == principal</text>
  <text class="s" x="716" y="402">DENY → Lambda never invoked</text>
  <text class="s" x="716" y="420">Mode: LOG_ONLY, then ENFORCE</text>

  <!-- Tools -->
  <rect class="box" x="952" y="110" width="220" height="330" rx="10" stroke="#c2410c"/>
  <text class="t" x="966" y="136">AWS Lambda tools</text>
  <text class="s" x="966" y="160">get_player_performance</text><text class="s" x="966" y="178">compare_players (ceiling)</text>
  <text class="s" x="966" y="196">find_players (price, consistency,</text><text class="s" x="966" y="212">  reliability)</text>
  <text class="s" x="966" y="234">get_my_team</text><text class="s" x="966" y="252">build_team (PuLP solver)</text>
  <text class="s" x="966" y="270">adjust_team</text><text class="s" x="966" y="288">propose_trades (propose-only)</text>
  <text class="s" x="966" y="306">save_team (needs preview id)</text>
  <text class="s" x="966" y="338">Reuses src/common/* code</text><text class="s" x="966" y="356">Container image, least-priv IAM</text>
  <text class="s" x="966" y="374">Re-checks min_season + key prefix</text>
  <text class="s" x="966" y="392">Guardrails.yaml (age/avoid)</text>
  <text class="s" x="966" y="410">applied inside team tools</text>

  <!-- Data -->
  <rect class="box" x="1202" y="110" width="178" height="120" rx="10" stroke="#15803d"/>
  <text class="t" x="1216" y="136">S3 data lake</text>
  <text class="s" x="1216" y="158">curated/ Parquet</text><text class="s" x="1216" y="176">player_match, master,</text>
  <text class="s" x="1216" y="194">identity (PlayerId),</text><text class="s" x="1216" y="212">season_summary, projections</text>
  <rect class="box" x="1202" y="250" width="178" height="100" rx="10" stroke="#15803d"/>
  <text class="t" x="1216" y="276">DynamoDB</text>
  <text class="s" x="1216" y="298">PK USER#sub: profile,</text><text class="s" x="1216" y="316">team, locks, avoid,</text><text class="s" x="1216" y="334">trades, previews (TTL)</text>
  <rect class="box" x="1202" y="370" width="178" height="70" rx="10" stroke="#15803d" stroke-dasharray="5 4"/>
  <text class="t" x="1216" y="396">Glue + Athena</text>
  <text class="s" x="1216" y="416">ad-hoc / learning (optional)</text>

  <!-- Arrows -->
  <path class="ln" d="M110 260 V290"/>
  <path class="ln" d="M200 170 H232"/>
  <path class="ln" d="M232 232 H200"/>
  <path class="ln" d="M200 295 H452"/>
  <path class="ln" d="M200 380 H232"/>
  <path class="ln" d="M672 190 H702"/>
  <path class="ln" d="M922 270 H952"/>
  <path class="ln" d="M1172 170 H1202"/>
  <path class="ln" d="M1172 300 H1202"/>
  <path class="ln" d="M562 300 V330"/>
  <path d="M422 410 H440 V520 H1290 V350" fill="none" stroke="#334155" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <path d="M1172 410 H1202" fill="none" stroke="#15803d" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#g)"/>
  <path d="M812 440 V470" fill="none" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#r)"/>
  <rect x="722" y="472" width="180" height="34" rx="8" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="734" y="494" font-size="12.5" font-weight="700" fill="#b91c1c">Denied: out-of-tier request</text>

  <!-- numbered badges -->
  <g>
    <circle cx="216" cy="158" r="11" fill="#1d4ed8"/><text class="n" x="212.5" y="162.5">1</text>
    <circle cx="216" cy="244" r="11" fill="#1d4ed8"/><text class="n" x="212.5" y="248.5">2</text>
    <circle cx="330" cy="295" r="11" fill="#1d4ed8"/><text class="n" x="326.5" y="299.5">3</text>
    <circle cx="687" cy="176" r="11" fill="#1d4ed8"/><text class="n" x="683.5" y="180.5">4</text>
    <circle cx="937" cy="256" r="11" fill="#15803d"/><text class="n" x="933.5" y="260.5">5</text>
    <circle cx="1187" cy="156" r="11" fill="#15803d"/><text class="n" x="1183.5" y="160.5">6</text>
  </g>

  <!-- offline + ops band -->
  <rect x="20" y="540" width="650" height="150" rx="10" fill="#fff" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text class="t" x="34" y="566">Offline data pipeline (Phase 1: stays on your PC)</text>
  <text class="s" x="34" y="590">Footywire scrapers → clean → features → projection model → shortlist (existing app/src/common/*)</text>
  <text class="s" x="34" y="610">→ publish_to_aws: schema check + S3 sync of curated/ + manifest</text>
  <text class="s" x="34" y="636">Per-user CSVs (squads, locks, avoid, trades) → one-off seed into DynamoDB as user #1</text>
  <text class="s" x="34" y="662">Phase 7: EventBridge + Step Functions + Fargate/Lambda for in-season refresh</text>

  <rect x="702" y="540" width="678" height="150" rx="10" fill="#fff" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text class="t" x="716" y="566">Cross-cutting</text>
  <text class="s" x="716" y="590">Observability: AgentCore observability, CloudWatch logs/metrics/alarms, X-Ray (denials, latency, tokens)</text>
  <text class="s" x="716" y="610">Security: IAM least privilege per Lambda · KMS · Secrets Manager / credential providers · no user path to data</text>
  <text class="s" x="716" y="630">Cost: AWS Budgets, per-user daily caps, maxIterations/maxTokens, prompt caching</text>
  <text class="s" x="716" y="650">Delivery: AWS CDK (Python) + AgentCore CLI · eval set + authorization matrix gate each release</text>
  <text class="s" x="716" y="670">Guardrails: Bedrock Guardrails on the agent; guardrails.yaml (age/avoid) inside team tools</text>

  <!-- legend / steps -->
  <rect x="20" y="715" width="1360" height="140" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text class="t" x="34" y="741">Request flow</text>
  <text class="s" x="34" y="765">1  User signs in via Cognito Hosted UI (code + PKCE) → 2  Cognito issues JWT → 3  SPA calls AgentCore Runtime with Bearer JWT; Runtime validates it and passes the Authorization header to the agent</text>
  <text class="s" x="34" y="786">4  Agent calls a tool through the Gateway, forwarding the same JWT → Gateway validates, interceptor injects user_id/min_season, Cedar allows or denies parameters</text>
  <text class="s" x="34" y="807">5  ALLOW: Lambda tool executes with its own IAM role (the LLM never supplies identity) → 6  reads curated Parquet in S3 / the caller's own DynamoDB partition; solver output re-validated</text>
  <text class="s" x="34" y="828">Dashed line: non-LLM CRUD path (My Team page) through API Gateway JWT authorizer → team-service Lambda → DynamoDB.   Green dashed: optional Athena.   Items marked [verify] in 02_ARCHITECTURE.md are spikes S1–S3.</text>
</svg>
